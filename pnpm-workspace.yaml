packages: [.]
allowBuilds:
  sharp: true
  unrs-resolver: true
overrides:
  # 전이 의존의 advisory 하한. 소비 패키지 범위 안의 값이라 동작 범위를 넓히지 않는다.
  # postcss: GHSA-r28c-9q8g-f849(<=8.5.17). @tailwindcss/postcss·shadcn이 옛 postcss를 끌어온다
  postcss@<8.5.18: ^8.5.18
  # brace-expansion 5.x: minimatch 10(typescript-eslint, lint 전용)이 끌어온다
  brace-expansion@>=5 <5.0.12: ^5.0.12
  # browserslist·baseline-browser-mapping: @babel/core(styled-jsx, eslint-plugin-react-hooks, shadcn)가 끌어온다
  browserslist@<4.28.7: ^4.28.7
  baseline-browser-mapping@<2.11.0: ^2.11.0
